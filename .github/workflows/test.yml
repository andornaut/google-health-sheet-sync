name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite runs the .gs sources under Node with stubbed Apps Script
      # globals, so it needs no clasp login and no Google project.
      - name: Run tests
        run: npm test
